name: Release

# One click releases a new version.
#
#   Actions tab -> Release -> Run workflow -> pick patch, minor or major.
#
# The workflow works out the next version from the latest tag, tests and builds
# it, waits for approval, publishes to PyPI, then creates the tag and the GitHub
# Release with generated notes and the built files attached.
#
# The git tag is the only source of the version: tag v0.2.0 is whatmodel 0.2.0.
# A rehearsal run (v0.2.0rc1) does everything except publish to PyPI.
#
# Publishing a GitHub Release by hand still works and runs the same jobs.
#
# Jobs run in order and each needs the one before it:
#   plan -> test -> build -> publish-pypi -> github-release
#
# Publishing uses PyPI Trusted Publishing (OIDC). There are no API tokens or
# secrets. The publish job must stay in this file: PyPI does not accept
# trusted publishing from a reusable workflow. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      rehearsal:
        description: Rehearsal only (rc tag, nothing goes to PyPI)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, so two runs can never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      is_rc: ${{ steps.plan.outputs.is_rc }}
    steps:
      - name: Check out the code with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::Releases are cut from main. This run was started on $REF."
              exit 1
            fi
            released="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -n "$released" && "$REHEARSAL" != "true" ]]; then
              echo "::error::This commit is already released as $released. Push a new commit before releasing again."
              exit 1
            fi
            latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
            esac
            next="${major}.${minor}.${patch}"
            if [[ "$REHEARSAL" == "true" ]]; then
              count="$(git tag --list "v${next}rc*" | wc -l | tr -d ' ')"
              tag="v${next}rc$((count + 1))"
            else
              tag="v${next}"
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
            echo "Latest release is $latest; this run will release $tag."
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.ZrcN. Nothing was built or published."
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            if [[ "$tag" == *rc* ]]; then echo "is_rc=true"; else echo "is_rc=false"; fi
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [plan, test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out the code with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # hatch-vcs reads the version from the tag. On a button-started run the
      # tag is not on GitHub yet (it is created only after PyPI accepts the
      # files), so it is set here, in this job's checkout only.
      - name: Tag this commit locally
        run: git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null || git tag "$TAG"

      # The version is also passed in directly. When the commit carries another
      # tag as well (a rehearsal of an already released commit), git alone
      # cannot tell hatch-vcs which of the two tags to use.
      - name: Build the sdist and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.plan.outputs.version }}
        run: uv build

      - name: Check that the built version matches the tag
        run: |
          ls -l dist
          for file in "dist/whatmodel-${VERSION}.tar.gz" "dist/whatmodel-${VERSION}-py3-none-any.whl"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Expected $file. The build did not produce version ${VERSION}."
              exit 1
            fi
          done
          if [[ "$(ls dist | wc -l)" -ne 2 ]]; then
            echo "::error::dist/ should hold exactly one sdist and one wheel."
            exit 1
          fi

      - name: Validate the metadata
        run: uvx twine check --strict dist/*

      - name: Smoke test the wheel in a clean environment
        run: |
          wheel="dist/whatmodel-${VERSION}-py3-none-any.whl"
          reported="$(uv run --isolated --no-project --with "$wheel" whatmodel --version)"
          echo "$reported"
          if [[ "$reported" != "whatmodel ${VERSION}" ]]; then
            echo "::error::whatmodel --version printed '$reported', expected 'whatmodel ${VERSION}'."
            exit 1
          fi
          uv run --isolated --no-project --with "$wheel" whatmodel qwen3.5:4b --offline

      - name: Upload dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [plan, build]
    if: needs.plan.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/whatmodel
    permissions:
      id-token: write # trusted publishing; nothing else is granted
    steps:
      - name: Download the files built by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Tag and publish the GitHub Release
    needs: [plan, build, publish-pypi]
    # Runs after PyPI succeeds, and also for rehearsals, where the PyPI job is skipped.
    if: >-
      ${{
        !cancelled()
        && needs.build.result == 'success'
        && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the tag, the release and its assets
    steps:
      - name: Download the files built by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the release, or attach files to the one that started this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.plan.outputs.tag }}
          IS_RC: ${{ needs.plan.outputs.is_rc }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "release" ]]; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          options=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$IS_RC" == "true" ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "${options[@]}" dist/*
