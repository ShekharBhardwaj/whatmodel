# Categories for GitHub's auto-generated release notes.
# A pull request lands in the first category whose label it carries.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: New tokens
      labels:
        - tokens
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Other changes
      labels:
        - "*"
