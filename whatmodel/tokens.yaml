# whatmodel token dictionary
#
# Every meaning whatmodel knows lives in this file. The code only knows how to
# split a name into tokens and look each token up here, so you can teach it a
# new token without touching any Python. CONTRIBUTING.md has a walkthrough.
#
# How matching works
#   - Matching ignores case, and "-", "_" and "." all count as the same
#     separator. A dot between two digits is a decimal point, so 3.5 stays whole.
#   - A pattern must match a whole token. Multi-part patterns such as gpt-oss or
#     q4_k_m match across separators.
#   - A token that matches no entry is reported as unknown.
#   - A token that matches two or more entries is reported as ambiguous, with
#     every reading shown. Nothing is ever picked for the user.
#
# Entry fields
#   pattern      required  A literal, or a list of literals that mean the same
#                          thing. With "regex: true" it is a regular expression;
#                          write "_" wherever the name has a separator.
#   category     required  One of the ids under "categories".
#   label        required  The short phrase shown in the output.
#   explanation  required  One plain-English sentence.
#   regex        optional  true when pattern is a regular expression.
#   examples     regex     Tokens the pattern must match. Required for regex
#                          entries: the tests check them, and "whatmodel tokens"
#                          prints them instead of the raw regex.
#   value        optional  Normalized value for JSON and the library. Defaults
#                          to the literal as written here, or to the matched
#                          token for a regex.
#   after        optional  Only match directly after a token of this category.
#   maker        optional  Family entries only: who makes the family.
#   implies      optional  Facts in other categories that this token settles, as
#                          "category: token". The token must be an entry of that
#                          category, and its label is what gets shown. Example:
#                          A3B implies "architecture: moe".
#
# label, explanation and value may use {text} (the matched token, lowercased)
# and any named regex group. Add !u to uppercase one, as in {text!u}.
#
# Category fields
#   heading      required  The row name in the output. Categories that share a
#                          heading share a row.
#   description  required  One sentence saying what this kind of token tells you.
#   default      optional  What to show when no token in the name belongs to the
#                          category: a label, or a mapping with label and
#                          explanation.

schema: 1

# Order here is the display order.
categories:
  host:
    heading: Registry
    description: The server the model is pulled from, when the name spells one out.
  org:
    heading: Publisher
    description: The account that uploaded the model, which is not always the team that trained it.
  family:
    heading: Family
    description: The model line this belongs to, as named by the team that trained it.
  version:
    heading: Version
    description: Which generation or release of the family this is.
  size:
    heading: Size
    description: How many parameters (learned weights) the model has, the main driver of quality, speed and memory use.
  effective_size:
    heading: Size
    description: The size the model behaves like in memory when its full parameter count is larger.
  active_params:
    heading: Size
    description: How many parameters a mixture-of-experts model actually uses for each token.
  architecture:
    heading: Architecture
    description: How the model's parameters are organized, which affects how fast it runs for its size.
  tier:
    heading: Tier
    description: The maker's label for where the model sits in its lineup, from small and fast to large and capable.
  tuning:
    heading: Tuning
    description: What the model was trained or fine-tuned to do.
  quantization:
    heading: Compression
    description: How the weights were compressed to save memory, usually at a small cost in quality.
  format:
    heading: Format
    description: The file format the weights are stored in, which decides which apps can load them.
  context:
    heading: Context
    description: How much text the model can read at once, when the name states it.
  build:
    heading: Build
    description: Which snapshot or release stage of the model this is.
  hosting:
    heading: Runs
    description: Where the model actually runs.
    default:
      label: locally
      value: local
      explanation: Nothing in the name marks it as hosted, so the weights download and run on your own machine.

tokens:
  # ---------------------------------------------------------------- host ----
  - pattern: [hf.co, huggingface.co]
    category: host
    label: Hugging Face
    explanation: Pulled straight from the Hugging Face Hub rather than from the Ollama library.

  - pattern: [registry.ollama.ai, ollama.com]
    category: host
    label: Ollama registry
    explanation: Ollama's own registry, which is also where a name without a host comes from.

