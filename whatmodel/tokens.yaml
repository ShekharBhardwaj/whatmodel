  # ------------------------------------------------------------- version ----
  - pattern: '\d{1,2}(?:\.\d{1,2}){0,2}'
    regex: true
    category: version
    after: family
    label: '{text}'
    explanation: Release {text} of this family, where a higher number is newer.
    examples: ['3', '3.5', '0.1']

  - pattern: '(?P<major>\d{1,2})_(?P<minor>\d)'
    regex: true
    category: version
    after: family
    value: '{major}.{minor}'
    label: '{major}.{minor}'
    explanation: Release {major}.{minor} of this family, written with a dash instead of a dot.
    examples: ['3-5', '4-1']

  - pattern: 'v(?P<n>\d{1,2}(?:\.\d{1,2}){0,2})'
    regex: true
    category: version
    label: 'v{n}'
    explanation: Version {n} of this model, where a higher number is newer.
    examples: [v0.3, V2, v1.5]

  - pattern: 'k(?P<n>\d{1,2}(?:\.\d{1,2})?)'
    regex: true
    category: version
    after: family
    label: 'K{n}'
    explanation: Generation K{n} of this family, where a higher number is newer.
    examples: [k2, k3.1]

  - pattern: '(?P<n>\d{1,2})n'
    regex: true
    category: version
    after: family
    label: '{n}n'
    explanation: Generation {n}n, where the n marks a line designed for phones, laptops and other small devices.
    examples: [3n]

  - pattern: '(?P<n>\d)o'
    regex: true
    category: version
    after: family
    label: '{n}o'
    explanation: Generation {n}o, where the o stands for omni, meaning one model handles text, images and audio.
    examples: [4o]

  # ---------------------------------------------------------------- size ----
  - pattern: '(?P<n>\d+(?:\.\d+)?)b'
    regex: true
    category: size
    value: '{n}B'
    label: '{n}B parameters'
    explanation: About {n} billion parameters (learned weights), where more usually means more capable but slower and hungrier for memory.
    examples: [4b, 12B, 1.5b]

  - pattern: '(?P<n>\d+(?:\.\d+)?)m'
    regex: true
    category: size
    value: '{n}M'
    label: '{n}M parameters'
    explanation: About {n} million parameters (learned weights), which is tiny by current standards and runs on almost anything.
    examples: [270m, 135M]

  - pattern: '(?P<n>\d+(?:\.\d+)?)t'
    regex: true
    category: size
    value: '{n}T'
    label: '{n}T parameters'
    explanation: About {n} trillion parameters (learned weights), which is far too large for a personal computer.
    examples: [1t]

  - pattern: '(?P<k>\d{1,2})x(?P<n>\d+(?:\.\d+)?)b'
    regex: true
    category: size
    value: '{k}x{n}B'
    label: '{k} experts of {n}B parameters each'
    explanation: Built from {k} expert networks of about {n} billion parameters each, only some of which run for each token.
    examples: [8x7b]
    implies: {architecture: moe}

  # ------------------------------------------------------ effective_size ----
  - pattern: 'e(?P<n>\d+(?:\.\d+)?)b'
    regex: true
    category: effective_size
    value: '{n}B'
    label: 'effective {n}B parameters'
    explanation: Behaves like a {n}-billion-parameter model in memory, although the full model holds more parameters than that.
    examples: [e2b, E4B]

  # ------------------------------------------------------- active_params ----
  - pattern: 'a(?P<n>\d+(?:\.\d+)?)b'
    regex: true
    category: active_params
    value: '{n}B'
    label: '{n}B active per token'
    explanation: Only about {n} billion of the model's parameters run for each token, so it is faster than its total size suggests.
    examples: [a3b, A22B]
    implies: {architecture: moe}

  # -------------------------------------------------------- architecture ----
  - pattern: moe
    category: architecture
    label: mixture of experts
    explanation: Built from many expert sub-networks of which only a few run for each token, so it is faster than its total size suggests.

  - pattern: dense
    category: architecture
    label: dense
    explanation: Every parameter is used for every token, which is how most models work.

  # ---------------------------------------------------------------- tier ----
  - pattern: pro
    category: tier
    label: pro tier (a more capable option)
    explanation: The maker's name for a larger, more capable model than the standard one in the same generation.

  - pattern: max
    category: tier
    label: max tier (the most capable option)
    explanation: The maker's name for its largest and most capable model in the same generation.

  - pattern: ultra
    category: tier
    label: ultra tier (the most capable option)
    explanation: The maker's name for its largest and most capable model in the same generation.

  - pattern: plus
    category: tier
    label: plus tier (a step up from standard)
    explanation: The maker's name for a model one step above the standard one in the same generation.

  - pattern: turbo
    category: tier
    label: turbo tier (tuned for speed)
    explanation: A faster and usually cheaper variant of the standard model, sometimes at a small cost in quality.

  - pattern: flash
    category: tier
    label: flash tier (built for speed and low cost)
    explanation: The maker's name for a smaller model built to answer quickly and cheaply.

  - pattern: lite
    category: tier
    label: lite tier (lighter and cheaper)
    explanation: A lighter, cheaper variant that gives up some quality for speed.

  - pattern: air
    category: tier
    label: air tier (lighter and cheaper)
    explanation: A lighter, cheaper variant that gives up some quality for speed.

  - pattern: mini
    category: tier
    label: mini tier (smaller and faster)
    explanation: A smaller, faster and cheaper sibling of the standard model.

  - pattern: nano
    category: tier
    label: nano tier (the smallest and fastest)
    explanation: The maker's smallest and fastest model in the same generation.

  - pattern: micro
    category: tier
    label: micro tier (very small)
    explanation: One of the maker's smallest models in the same generation.

  - pattern: tiny
    category: tier
    label: tiny tier (very small)
    explanation: One of the maker's smallest models in the same generation.

  - pattern: small
    category: tier
    label: small tier
    explanation: The smaller size in the maker's lineup, which is faster and needs less memory.

  - pattern: medium
    category: tier
    label: medium tier
    explanation: The middle size in the maker's lineup.

  - pattern: large
    category: tier
    label: large tier
    explanation: The larger size in the maker's lineup, which is more capable but slower and needs more memory.

  # "base" is also a tuning token, so it is reported as ambiguous.
  - pattern: base
    category: tier
    label: base size (the standard size in its lineup)
    explanation: The standard size in a lineup that also has smaller and larger versions.

  - pattern: haiku
    category: tier
    label: haiku tier (the smallest and fastest)
    explanation: Anthropic's name for its smallest and fastest model in a generation.

  - pattern: sonnet
    category: tier
    label: sonnet tier (the mid-size option)
    explanation: Anthropic's name for its mid-size model in a generation.

  - pattern: opus
    category: tier
    label: opus tier (the most capable option)
    explanation: Anthropic's name for its largest and most capable model in a generation.

  # -------------------------------------------------------------- tuning ----
  - pattern: [it, instruct]
    category: tuning
    label: instruction tuned (ready for chat)
    explanation: Fine-tuned to follow instructions and hold a conversation, unlike a raw base model.

  - pattern: chat
    category: tuning
    label: chat tuned
    explanation: Fine-tuned for back-and-forth conversation.

  # "base" is also a tier token, so it is reported as ambiguous.
  - pattern: base
    category: tuning
    label: base model (not tuned for chat)
    explanation: The raw pretrained model, which continues text but was not taught to follow instructions or chat.

  - pattern: [code, coder]
    category: tuning
    label: code tuned
    explanation: Trained or fine-tuned mainly for writing and explaining code.

  - pattern: [vision, vl]
    category: tuning
    label: vision (reads images)
    explanation: Can take images as input alongside text.

  - pattern: multimodal
    category: tuning
    label: multimodal (reads more than text)
    explanation: Can take other kinds of input, such as images or audio, alongside text.

  - pattern: [embed, embedding, embeddings]
    category: tuning
    label: embedding model (does not chat)
    explanation: Turns text into lists of numbers for search and similarity, and cannot hold a conversation.

  - pattern: [rerank, reranker]
    category: tuning
    label: reranker (does not chat)
    explanation: Scores how well each passage answers a query so search results can be reordered, and cannot hold a conversation.

  - pattern: [thinking, reasoning, reasoner]
    category: tuning
    label: thinking (reasons before answering)
    explanation: Works through a problem step by step before giving its answer, which is slower but better on hard questions.

  - pattern: [distill, distilled]
    category: tuning
    label: distilled
    explanation: A smaller model trained to imitate a larger one, keeping much of its ability at a fraction of the size.

  - pattern: uncensored
    category: tuning
    label: uncensored
    explanation: Fine-tuned to remove the refusals built into the original model.

  - pattern: abliterated
    category: tuning
    label: abliterated (refusals removed)
    explanation: Edited to remove the model's built-in tendency to refuse requests, without retraining it.

  # -------------------------------------------------------- quantization ----
  - pattern: 'q(?P<bits>[2-8])_k_s'
    regex: true
    category: quantization
    value: 'Q{bits}_K_S'
    label: '{bits}-bit (Q{bits}_K_S, the smaller variant)'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's K-quant method, in the small variant that saves the most space.
    examples: [q4_k_s, Q5_K_S]

  - pattern: 'q(?P<bits>[2-8])_k_m'
    regex: true
    category: quantization
    value: 'Q{bits}_K_M'
    label: '{bits}-bit (Q{bits}_K_M, the balanced variant)'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's K-quant method, in the medium variant that balances size and quality.
    examples: [q4_k_m, Q5_K_M]

  - pattern: 'q(?P<bits>[2-8])_k_l'
    regex: true
    category: quantization
    value: 'Q{bits}_K_L'
    label: '{bits}-bit (Q{bits}_K_L, the larger variant)'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's K-quant method, in the large variant that keeps the most quality.
    examples: [q3_k_l, Q4_K_L]

  - pattern: 'q(?P<bits>[2-8])_k'
    regex: true
    category: quantization
    value: 'Q{bits}_K'
    label: '{bits}-bit (Q{bits}_K)'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's K-quant method.
    examples: [q6_k, Q2_K]

  - pattern: 'q(?P<bits>[2-8])_(?P<v>[01])'
    regex: true
    category: quantization
    value: 'Q{bits}_{v}'
    label: '{bits}-bit (Q{bits}_{v})'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's original, simpler method.
    examples: [q4_0, Q8_0, q5_1]

  - pattern: 'q(?P<bits>[2-8])'
    regex: true
    category: quantization
    value: 'Q{bits}'
    label: '{bits}-bit'
    explanation: Weights compressed to roughly {bits} bits each instead of the original 16 or 32.
    examples: [q4, Q8]

  - pattern: 'iq(?P<bits>[1-4])_(?:xxs|xs|s|m)'
    regex: true
    category: quantization
    value: '{text!u}'
    label: '{bits}-bit ({text!u})'
    explanation: Weights compressed to roughly {bits} bits each with llama.cpp's i-quant method, which keeps more quality at very small sizes.
    examples: [iq3_xxs, IQ4_XS, iq2_m]

  - pattern: '(?P<bits>[1-8])bit'
    regex: true
    category: quantization
    label: '{bits}-bit'
    explanation: Weights compressed to {bits} bits each instead of the original 16 or 32.
    examples: [4bit, 8bit]

  - pattern: '(?P<bpw>\d(?:\.\d{1,2})?)bpw'
    regex: true
    category: quantization
    label: '{bpw} bits per weight'
    explanation: Weights compressed to an average of {bpw} bits each, the sizing used by the ExLlama formats.
    examples: [4.0bpw, 6.5bpw]

  - pattern: 'int(?P<bits>4|8)'
    regex: true
    category: quantization
    label: '{bits}-bit integers'
    explanation: Weights stored as {bits}-bit whole numbers instead of 16 or 32-bit decimals.
    examples: [int4, int8]

  - pattern: [fp16, f16]
    category: quantization
    value: fp16
    label: 16-bit floats (not compressed)
    explanation: Weights kept at 16-bit precision, which preserves full quality but needs the most memory.

  - pattern: bf16
    category: quantization
    label: 16-bit floats (not compressed)
    explanation: Weights kept in bfloat16, the 16-bit format most models are trained in, which preserves full quality but needs the most memory.

  - pattern: [fp32, f32]
    category: quantization
    value: fp32
    label: 32-bit floats (not compressed)
    explanation: Weights kept at full 32-bit precision, which takes twice the memory of 16-bit for no practical gain when running a model.

  - pattern: qat
    category: quantization
    label: quantization-aware trained
    explanation: Trained with compression in the loop, so the compressed weights lose less quality than ordinary after-the-fact quantization.

  - pattern: awq
    category: quantization
    label: AWQ (for GPU servers)
    explanation: Compressed with Activation-aware Weight Quantization, a method used mostly with GPU serving software.

  - pattern: gptq
    category: quantization
    label: GPTQ (for GPUs)
    explanation: Compressed with GPTQ, an older quantization method aimed at running on GPUs.

  - pattern: [exl2, exl3]
    category: quantization
    label: ExLlama format (for GPUs)
    explanation: Compressed for the ExLlama GPU runtime, which lets publishers pick a precise number of bits per weight.

  - pattern: imatrix
    category: quantization
    label: importance-matrix calibrated
    explanation: Compressed with the help of sample text that shows which weights matter most, which keeps more quality at the same size.

  # -------------------------------------------------------------- format ----
  - pattern: gguf
    category: format
    label: GGUF (for llama.cpp, Ollama and LM Studio)
    explanation: A single-file format used by llama.cpp and the apps built on it, such as Ollama and LM Studio.

  - pattern: ggml
    category: format
    label: GGML (older format, replaced by GGUF)
    explanation: The predecessor of GGUF, which current versions of llama.cpp and Ollama no longer load.

  - pattern: safetensors
    category: format
    label: Safetensors (for Transformers and similar frameworks)
    explanation: The standard weights format for PyTorch-based tools such as Hugging Face Transformers.

  - pattern: mlx
    category: format
    label: MLX (for Apple silicon)
    explanation: Converted for Apple's MLX framework, which runs only on Macs with Apple silicon.

  - pattern: onnx
    category: format
    label: ONNX (portable runtime format)
    explanation: Exported to ONNX, a portable format that ONNX Runtime can run on many kinds of hardware.

  - pattern: openvino
    category: format
    label: OpenVINO (for Intel hardware)
    explanation: Converted for Intel's OpenVINO toolkit, which targets Intel processors and graphics chips.

  - pattern: hf
    category: format
    label: Transformers layout
    explanation: Weights laid out for the Hugging Face Transformers library rather than in the maker's original layout.

  # ------------------------------------------------------------- context ----
  - pattern: '(?P<n>\d{1,4})k'
    regex: true
    category: context
    label: '{n}k-token context window'
    explanation: Can read about {n} thousand tokens of text at once, counting both your prompt and its reply.
    examples: [4k, 128k]

  # --------------------------------------------------------------- build ----
  - pattern: latest
    category: build
    label: latest (the default build)
    explanation: A moving pointer to whichever build the publisher currently treats as the default, so its contents can change over time.

  - pattern: preview
    category: build
    label: preview (early release)
    explanation: An early release that the maker may still change or withdraw.

  - pattern: [exp, experimental]
    category: build
    value: experimental
    label: experimental
    explanation: An experimental release that the maker may change or withdraw without notice.

  - pattern: beta
    category: build
    label: beta (pre-release)
    explanation: A pre-release build that came before the finished version.

  # Date stamps. The year range is 2023 to 2027; widen it as the years pass.
  # A stamp such as 0725 fits both month-day and month-year, so it is reported
  # as ambiguous rather than guessed.
  - pattern: '(?P<yy>2[3-7])(?P<mm>0[1-9]|1[0-2])'
    regex: true
    category: build
    value: '20{yy}-{mm}'
    label: 'released 20{yy}-{mm}'
    explanation: A date stamp read as year then month, so this snapshot is from month {mm} of 20{yy}.
    examples: ['2507', '2411']

  - pattern: '(?P<mm>0[1-9]|1[0-2])(?P<dd>0[1-9]|[12]\d|3[01])'
    regex: true
    category: build
    value: '{mm}-{dd}'
    label: 'dated {mm}-{dd} (month-day)'
    explanation: A date stamp read as month then day, so this snapshot is from day {dd} of month {mm}.
    examples: ['0725', '0613']

  - pattern: '(?P<mm>0[1-9]|1[0-2])(?P<yy>2[3-7])'
    regex: true
    category: build
    value: '20{yy}-{mm}'
    label: 'released 20{yy}-{mm}'
    explanation: A date stamp read as month then year, so this snapshot is from month {mm} of 20{yy}.
    examples: ['0725', '0126']

  - pattern: '(?P<mm>0[1-9]|1[0-2])_(?P<dd>0[1-9]|[12]\d|3[01])'
    regex: true
    category: build
    value: '{mm}-{dd}'
    label: 'dated {mm}-{dd} (month-day)'
    explanation: A date stamp read as month then day, so this snapshot is from day {dd} of month {mm}.
    examples: ['06-17']

  - pattern: '(?P<y>20[2-3]\d)(?P<m>0[1-9]|1[0-2])(?P<d>0[1-9]|[12]\d|3[01])'
    regex: true
    category: build
    value: '{y}-{m}-{d}'
    label: 'dated {y}-{m}-{d}'
    explanation: A date stamp, so this snapshot is from {y}-{m}-{d}.
    examples: ['20250514']

  # ------------------------------------------------------------- hosting ----
  - pattern: cloud
    category: hosting
    label: in the cloud (remote, not on your machine)
    explanation: Runs on the provider's servers, so nothing is downloaded and your prompts leave your machine.
