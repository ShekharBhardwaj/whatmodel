<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whatmodel: explain an LLM model name</title>
<meta name="description" content="Paste an LLM model name and see what each part of it means, in plain English.">
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6860;
    --line: #dedbd2; --accent: #0b6e69; --warn: #9a5b00; --mark: #eef6f5;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --ink: #ecebe6; --muted: #9c998f;
      --line: #35342f; --accent: #5cc8c1; --warn: #e0a84a; --mark: #1f2b2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font: 600 28px/1.2 var(--mono); margin: 0 0 6px; letter-spacing: -0.02em; }
  p.lede { margin: 0 0 28px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 14px; font: 16px var(--mono);
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input[type="text"]:focus-visible, button:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    padding: 12px 18px; font: 600 16px system-ui, sans-serif; cursor: pointer;
    color: var(--bg); background: var(--accent); border: 0; border-radius: 8px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .chip {
    font: 13px var(--mono); padding: 5px 10px; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  #status { margin: 28px 0 0; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--warn); }
  #result { margin-top: 12px; }
  #result h2 { font: 600 17px var(--mono); margin: 0 0 10px; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  thead th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  td.field { color: var(--accent); font-weight: 600; white-space: nowrap; }
  td.source { color: var(--muted); white-space: nowrap; font-size: 14px; }
  td .why { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  tr.flag td.field, tr.flag td.value { color: var(--warn); }
  tr.implied td { background: var(--mark); }
  ul.notes { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
  ul.notes a { color: var(--accent); }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; color: var(--muted); font-size: 14px; cursor: pointer; }
  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
  code { font: 14px var(--mono); }
</style>
</head>
<body>
<main>
  <h1>whatmodel</h1>
  <p class="lede">Paste an LLM model name and see what each part of it means.</p>

  <form id="form">
    <input id="name" type="text" aria-label="Model name" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="qwen3.5:4b" maxlength="300">
    <button id="go" type="submit" disabled>Explain</button>
  </form>
  <ul class="chips" aria-label="Examples">
    <li><button type="button" class="chip">gemma4:e2b-it-qat</button></li>
    <li><button type="button" class="chip">bartowski/Qwen_Qwen3-30B-A3B-GGUF</button></li>
    <li><button type="button" class="chip">Llama-3-8B-Instruct.Q4_K_M.gguf</button></li>
    <li><button type="button" class="chip">deepseek-ai/DeepSeek-R1-Distill-Qwen-7B</button></li>
    <li><button type="button" class="chip">anthropic/claude-3.5-sonnet:free</button></li>
  </ul>
  <label class="toggle"><input id="verbose" type="checkbox"> Explain each row</label>

  <p id="status" role="status" aria-live="polite">Loading whatmodel…</p>
  <section id="result" aria-live="polite"></section>

  <footer>
    This page reads the name only. It runs in your browser and sends the name nowhere.
    The command-line tool can also look up facts a name does not show:
    <code>pip install whatmodel</code>.
    <a href="https://github.com/ShekharBhardwaj/whatmodel">Source on GitHub</a>.
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const input = document.getElementById("name");
const button = document.getElementById("go");
const verbose = document.getElementById("verbose");
let explain = null;
let last = null;

// The Python side returns plain data. All wording comes from the whatmodel package.
const PYTHON = `
import json
from whatmodel import parse, __version__
from whatmodel.lookup import ModelInfo
from whatmodel import render

def explain(name):
    try:
        parsed = parse(name)
    except ValueError as error:
        return json.dumps({"error": str(error)})
    info = ModelInfo(parsed)
    labels = getattr(render, "SOURCE_LABELS", {})
    rows = [
        {
            "heading": row.heading,
            "entries": [{"label": label, "why": why} for label, why in row.entries],
            "source": labels.get(row.source, row.source),
            "implied": row.source == "implied",
            "flag": row.heading in ("Unknown", "Ambiguous"),
        }
        for row in render.name_rows(parsed)
    ]
    notes = render.info_notes(info) if hasattr(render, "info_notes") else []
    report = render.report_url(parsed) if parsed.unknown and hasattr(render, "report_url") else None
    return json.dumps({"name": parsed.raw, "rows": rows, "notes": notes, "report": report})

VERSION = __version__
`;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value; else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function show(data) {
  resultEl.replaceChildren();
  if (data.error) {
    statusEl.textContent = "That is not a model name: " + data.error + ".";
    statusEl.className = "error";
    return;
  }
  statusEl.textContent = "";
  statusEl.className = "";
  const body = el("tbody");
  for (const row of data.rows) {
    const value = el("td", { class: "value" });
    row.entries.forEach((entry, index) => {
      if (index) value.append(el("br"));
      value.append(entry.label);
      if (verbose.checked && entry.why) value.append(el("span", { class: "why" }, entry.why));
    });
    const classes = [row.flag ? "flag" : "", row.implied ? "implied" : ""].join(" ").trim();
    body.append(el("tr", classes ? { class: classes } : {},
      el("td", { class: "field" }, row.heading), value, el("td", { class: "source" }, row.source)));
  }
  const table = el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Field"), el("th", {}, "Value"), el("th", {}, "Source"))),
    body);
  resultEl.append(el("h2", {}, data.name), el("div", { class: "scroll" }, table));
  const notes = el("ul", { class: "notes" });
  for (const note of data.notes) notes.append(el("li", {}, note));
  if (data.report) {
    notes.append(el("li", {}, "Know what an unknown token means? ",
      el("a", { href: data.report, rel: "noopener", target: "_blank" }, "Report it on GitHub"), "."));
  }
  if (notes.children.length) resultEl.append(notes);
}

function run(name) {
  name = name.trim();
  if (!name || !explain) return;
  last = JSON.parse(explain(name));
  show(last);
  const url = new URL(location.href);
  url.searchParams.set("name", name);
  history.replaceState(null, "", url);
}

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  run(input.value);
});
document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
  input.value = chip.textContent;
  run(input.value);
}));
verbose.addEventListener("change", () => { if (last) show(last); });

(async () => {
  try {
    const params = new URLSearchParams(location.search);
    const pyodide = await loadPyodide();
    await pyodide.loadPackage(["micropip", "pyyaml"]);
    const micropip = pyodide.pyimport("micropip");
    // ?wheel=<url> loads a local build instead of the released package.
    await micropip.install("rich");
    await micropip.install.callKwargs(params.get("wheel") || "whatmodel", { deps: false });
    pyodide.runPython(PYTHON);
    explain = pyodide.globals.get("explain");
    statusEl.textContent = "Ready. whatmodel " + pyodide.globals.get("VERSION") + ".";
    button.disabled = false;
    const given = params.get("name");
    if (given) { input.value = given; run(given); } else { input.focus(); }
  } catch (error) {
    statusEl.textContent = "whatmodel could not be loaded in this browser. " + error;
    statusEl.className = "error";
  }
})();
</script>
</body>
</html>
